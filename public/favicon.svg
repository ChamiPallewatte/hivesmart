<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="hiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hexagon Hive Base -->
  <polygon points="50,6 90,29 90,75 50,98 10,75 10,29" fill="#0f172a" stroke="url(#hiveGrad)" stroke-width="4" />
  <!-- Inner Circuit / Smart Nodes -->
  <path d="M50 24 L75 38 L75 66 L50 80 L25 66 L25 38 Z" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- Central Tech Symbol: Code Bracket & Spark -->
  <path d="M42 42 L34 50 L42 58" stroke="url(#hiveGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M58 42 L66 50 L58 58" stroke="url(#hiveGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="50" r="3" fill="#10b981" filter="url(#glow)"/>
</svg>

