<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e22" />
      <stop offset="50%" stop-color="#081736" />
      <stop offset="100%" stop-color="#0a1935" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  
  <!-- Honeycomb Geometric Circuit Rings -->
  <g opacity="0.12" stroke="#f59e0b" stroke-width="1.5">
    <polygon points="1050,40 1150,100 1150,220 1050,280 950,220 950,100" fill="none" />
    <polygon points="1050,80 1115,120 1115,195 1050,235 985,195 985,120" fill="none" />
    <circle cx="1050" cy="160" r="12" fill="#f59e0b" />
  </g>

  <!-- Brand Logo & Badge -->
  <g transform="translate(100, 100)">
    <!-- Honeycomb Mark -->
    <polygon points="30,4 54,18 54,46 30,60 6,46 6,18" fill="#081736" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M22 24 L22 40 M22 32 L38 32 M38 24 L38 40" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <text x="75" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">Hive <tspan fill="#f59e0b">smart</tspan></text>
  </g>

  <!-- Regional Hub Badges -->
  <g transform="translate(100, 195)">
    <rect x="0" y="0" width="180" height="38" rx="19" fill="#0d1b38" stroke="#f59e0b" stroke-opacity="0.4" />
    <circle cx="20" cy="19" r="6" fill="#10b981" />
    <text x="36" y="24" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SRI LANKA HUB</text>

    <rect x="195" y="0" width="170" height="38" rx="19" fill="#0d1b38" stroke="#f59e0b" stroke-opacity="0.4" />
    <circle cx="215" cy="19" r="6" fill="#f59e0b" />
    <text x="231" y="24" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">DUBAI / UAE</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="315" fill="#ffffff" font-family="system-ui, sans-serif" font-size="56" font-weight="900" letter-spacing="-1.5">
    Building Digital Experiences
  </text>
  <text x="100" y="385" fill="url(#goldGrad)" font-family="system-ui, sans-serif" font-size="56" font-weight="900" letter-spacing="-1.5">
    That Grow Your Business.
  </text>

  <!-- Subtitle -->
  <text x="100" y="455" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="24" font-weight="400">
    Premier Website Development • ATS CV Design • Mobile Applications
  </text>

  <!-- WhatsApp Indicator Tag -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="360" height="50" rx="25" fill="#059669" />
    <text x="32" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Direct WhatsApp Inquiry Ready</text>
  </g>
</svg>
