<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="cvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background Board -->
  <rect x="20" y="20" width="360" height="260" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  
  <!-- Resume Sheet Simulation -->
  <rect x="100" y="40" width="200" height="225" rx="6" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))" />
  
  <!-- Header Name & Title -->
  <rect x="120" y="60" width="100" height="12" rx="3" fill="#0f172a" />
  <rect x="120" y="78" width="70" height="6" rx="2" fill="#0284c7" />

  <!-- Divider -->
  <line x1="120" y1="92" x2="280" y2="92" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Section 1: Experience -->
  <rect x="120" y="105" width="60" height="7" rx="2" fill="#059669" />
  <rect x="120" y="118" width="145" height="5" rx="2" fill="#94a3b8" />
  <rect x="120" y="128" width="155" height="5" rx="2" fill="#cbd5e1" />
  <rect x="120" y="138" width="130" height="5" rx="2" fill="#cbd5e1" />

  <!-- Section 2: Skills & Matrix -->
  <rect x="120" y="155" width="45" height="7" rx="2" fill="#059669" />
  <rect x="120" y="168" width="40" height="12" rx="4" fill="#e0f2fe" />
  <rect x="165" y="168" width="45" height="12" rx="4" fill="#d1fae5" />
  <rect x="215" y="168" width="38" height="12" rx="4" fill="#e0f2fe" />

  <!-- Section 3: Education -->
  <rect x="120" y="192" width="55" height="7" rx="2" fill="#059669" />
  <rect x="120" y="205" width="135" height="5" rx="2" fill="#94a3b8" />
  <rect x="120" y="215" width="110" height="5" rx="2" fill="#cbd5e1" />

  <!-- ATS Verified Badge Overlay -->
  <g transform="translate(255, 48)">
    <circle cx="20" cy="20" r="18" fill="#10b981" />
    <path d="M12 20 L17 25 L28 14" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

