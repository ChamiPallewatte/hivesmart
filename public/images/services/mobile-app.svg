<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background Platform -->
  <rect x="20" y="20" width="360" height="260" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  
  <!-- Smartphone Frame -->
  <rect x="135" y="35" width="130" height="230" rx="20" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <!-- Screen Notch -->
  <rect x="175" y="42" width="50" height="8" rx="4" fill="#0f172a" />
  
  <!-- Screen Area -->
  <rect x="143" y="55" width="114" height="195" rx="12" fill="#090d16" />

  <!-- App Header -->
  <rect x="153" y="68" width="40" height="8" rx="2" fill="#38bdf8" />
  <circle cx="242" cy="72" r="5" fill="#10b981" />

  <!-- App Card Banner -->
  <rect x="153" y="86" width="94" height="42" rx="6" fill="url(#phoneGrad)" />
  <rect x="160" y="96" width="50" height="6" rx="2" fill="#ffffff" />
  <rect x="160" y="106" width="35" height="4" rx="2" fill="#e0f2fe" />

  <!-- App Grid Items -->
  <rect x="153" y="136" width="43" height="36" rx="6" fill="#1e293b" />
  <circle cx="174" cy="150" r="7" fill="#0284c7" />

  <rect x="204" y="136" width="43" height="36" rx="6" fill="#1e293b" />
  <circle cx="225" cy="150" r="7" fill="#10b981" />

  <rect x="153" y="178" width="43" height="36" rx="6" fill="#1e293b" />
  <circle cx="174" cy="192" r="7" fill="#f59e0b" />

  <rect x="204" y="178" width="43" height="36" rx="6" fill="#1e293b" />
  <circle cx="225" cy="192" r="7" fill="#8b5cf6" />

  <!-- Bottom Home Indicator -->
  <rect x="177" y="238" width="46" height="3" rx="1.5" fill="#64748b" />
