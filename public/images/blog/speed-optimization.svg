<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" fill="none">
  <defs>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="#090d16" rx="12" />
  
  <!-- Speedometer Arc Mockup -->
  <circle cx="300" cy="180" r="100" stroke="#1e293b" stroke-width="20" fill="none" stroke-dasharray="314" stroke-dashoffset="60" />
  <circle cx="300" cy="180" r="100" stroke="url(#meterGrad)" stroke-width="20" fill="none" stroke-dasharray="314" stroke-dashoffset="120" stroke-linecap="round" />
  
  <text x="300" y="175" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="48" font-weight="800">99</text>
  <text x="300" y="205" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="14" font-weight="700">LIGHTHOUSE SCORE</text>

  <!-- Metrics Badges -->
  <g transform="translate(100, 260)">
    <rect width="110" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="55" y="20" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">LCP</text>
    <text x="55" y="38" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="14" font-weight="700">0.4s</text>
  </g>
  <g transform="translate(245, 260)">
    <rect width="110" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="55" y="20" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">INP</text>
    <text x="55" y="38" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="14" font-weight="700">18ms</text>
  </g>
  <g transform="translate(390, 260)">
    <rect width="110" height="45" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="55" y="20" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">CLS</text>
    <text x="55" y="38" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="14" font-weight="700">0.00</text>
  </g>
</svg>

