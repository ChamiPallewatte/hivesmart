<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" fill="none">
  <defs>
    <linearGradient id="mobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="#0f172a" rx="12" />
  
  <!-- Left Phone: iOS -->
  <g transform="translate(140, 60)">
    <rect width="130" height="230" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect x="40" y="8" width="50" height="6" rx="3" fill="#0f172a" />
    <rect x="15" y="30" width="100" height="40" rx="6" fill="#0284c7" />
    <circle cx="65" cy="115" r="22" fill="#38bdf8" opacity="0.2" />
    <text x="65" y="120" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="16" font-weight="700">iOS</text>
    <rect x="25" y="160" width="80" height="8" rx="4" fill="#475569" />
    <rect x="35" y="176" width="60" height="8" rx="4" fill="#475569" />
  </g>

  <!-- Right Phone: Android -->
  <g transform="translate(330, 60)">
    <rect width="130" height="230" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="65" cy="12" r="3" fill="#0f172a" />
    <rect x="15" y="30" width="100" height="40" rx="6" fill="#059669" />
    <circle cx="65" cy="115" r="22" fill="#10b981" opacity="0.2" />
    <text x="65" y="120" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="16" font-weight="700">Android</text>
    <rect x="25" y="160" width="80" height="8" rx="4" fill="#475569" />
    <rect x="35" y="176" width="60" height="8" rx="4" fill="#475569" />
  </g>
</svg>

